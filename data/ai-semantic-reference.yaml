precedence:
- id: PRE-001
  rank: 1
  rule: A dedicated canonical registry has precedence over a cross-reference record.
- id: PRE-002
  rank: 2
  rule: The Formula registry owns formula expressions and verification status.
- id: PRE-003
  rank: 3
  rule: The Roles registry owns public role definitions; the Process Role Map owns contextual process assignments and authority boundaries.
- id: PRE-004
  rank: 4
  rule: Artifact definitions own structure and state; the Artifact Role Map owns contextual creation, custody, review, approval, verification, acceptance, and receipt assignments.
- id: PRE-005
  rank: 5
  rule: Lifecycle definitions own sequence, handoffs, and lifecycle context.
- id: PRE-006
  rank: 6
  rule: Decision Guides own scenario-specific action and escalation paths.
- id: PRE-007
  rank: 7
  rule: Shared semantic records define cross-cutting terminology and interpretation.
- id: PRE-008
  rank: 8
  rule: Current verified source material has precedence over Atlas synthesis.
- id: PRE-009
  rank: 9
  rule: Source-limited or synthesized material must be labeled as such.
- id: PRE-010
  rank: 10
  rule: When authority varies by organization, do not invent a universal rule.
ai_usage:
  recommended:
  - Follow canonical links for full explanations.
  - Preserve verification labels.
  - Distinguish official source material from Atlas synthesis.
  - State uncertainty when a record is source-limited.
  - Do not infer that missing applicability means prohibition.
  - Do not treat commercial templates as PMI-prescribed forms.
  - Do not treat process groups as sequential lifecycle phases.
  - Do not equate waterfall with every form of predictive delivery.
  - Do not equate Scrum or Kanban with all adaptive delivery.
  avoid:
  - Inventing authority.
  - Merging risk, issue, and impediment.
  - Stating earned value as merely a percentage.
  - Placing management reserve inside BAC.
  - Describing all hybrid work as a separate standardized framework.
  - Presenting Atlas-generated crosswalks as official PMI mappings.
concepts:
- id: SEM-ROL-SPONSOR
  family: roles_authority
  preferred_term: Sponsor
  aliases:
  - project sponsor
  concise_definition: Champions the initiative and connects it to authorization, funding, strategic direction, and escalation authority.
  scope: Commonly associated with authorization, strategic alignment, funding sponsorship, and decisions beyond delegated project authority.
  distinctions:
  - The sponsor is not automatically the customer, acceptance authority, operational owner, or benefits owner.
  - Specific approval rights come from the organization's governance model.
  does_not_mean:
  - Universal owner of every project decision
  applicability:
  - organization_specific
  - common_across_approaches
  canonical_public_pages:
  - https://comdico.github.io/PMP_Atlas_Site/lifecycle/conception-authorization/
  related_processes:
