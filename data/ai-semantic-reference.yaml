  - change control board
  - CCB
  concise_definition: Evaluates and disposes controlled changes within an approved mandate.
  scope: Commonly decides changes that affect controlled commitments, baselines, or other governance thresholds.
  distinctions:
  - A standing CCB is one governance design; change authority may be assigned differently.
  does_not_mean:
  - Required review body for every adaptive reprioritization
  applicability:
