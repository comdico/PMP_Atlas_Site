- id: SEM-ROL-PROJECT-MANAGER
  family: roles_authority
  preferred_term: Project manager
  aliases:
  - PM
  concise_definition: Integrates project work, information, and decisions within delegated authority.
  scope: Commonly coordinates planning, execution, monitoring, communication, and escalation across the project system.
  distinctions:
  - Integration responsibility does not automatically grant specialist, sponsor, procurement, compliance, or acceptance authority.
  - Matters outside delegated limits are escalated through the governing route.
  does_not_mean:
  - Universal approver
  - Sole producer of project work
  applicability:
  - common_across_approaches
  - organization_specific
  canonical_public_pages:
