  - governing body
  concise_definition: Provides organizational direction and decisions under the initiative's governance model.
  scope: May decide funding, continuation, exceptions, baselines, escalation, or closure when those rights are explicitly assigned.
  distinctions:
  - Its mandate is defined by organizational governance rather than by a universal Atlas rule.
  does_not_mean:
  - A required committee with identical powers in every organization
  applicability:
