- id: SEM-ROL-PRODUCT-OWNER
  family: roles_authority
  preferred_term: Product owner
  aliases:
  - PO
  concise_definition: In product-oriented adaptive contexts, orders value-focused work and makes product decisions within the governing model.
  scope: Most precise as a Scrum accountability; other adaptive approaches may use different product roles.
  distinctions:
  - Product prioritization is separate from technical verification and formal acceptance unless governance explicitly combines them.
  does_not_mean:
  - Generic name for every adaptive leader
  - Automatic formal acceptance authority
  applicability:
  - scrum_specific
  - adaptive
  - hybrid
